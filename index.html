<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZTE - LFM Training on Field professional tools</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/gh/Stuk/jszip@v3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@v3.12.0/dist/pptxgen.bundle.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Urbanist:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; line-height: 1.6; }
    
    /* UI Header */
    .header { background: #0d1628; color: #fff; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; border-bottom: 4px solid #00a0d2; }
    .header h1 { font-size: 1.4rem; font-weight: 700; font-family: 'Montserrat', sans-serif; }
    .header-right { display: flex; gap: 1rem; align-items: center; }
    
    .sync-badge { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; background: rgba(255,255,255,0.1); border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
    .sync-badge.online { color: #22c55e; }
    .sync-badge.offline { color: #ef4444; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; }
    
    .btn { padding: 0.7rem 1.4rem; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; font-family: inherit; white-space: nowrap; }
    .btn-primary { background: #00a0d2; color: #fff; }
    .btn-primary:hover { background: #0084ad; transform: translateY(-1px); }
    .btn-secondary { background: #fff; color: #0d1628; border: 1px solid #cbd5e1; }
    
    /* Navigation */
    .nav { background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; overflow-x: auto; position: sticky; top: 0; z-index: 100; }
    .nav-item { flex: 1; min-width: 120px; padding: 1rem; text-align: center; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; font-weight: 600; color: #64748b; }
    .nav-item.active { border-bottom-color: #00a0d2; color: #00a0d2; background: #f0f9ff; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Cards & Forms */
    .form-container, .archive-container, .reports-container { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
    h2 { margin-bottom: 2rem; color: #0d1628; font-size: 1.8rem; font-family: 'Montserrat', sans-serif; }
    
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
    .form-col { display: flex; flex-direction: column; }
    .form-col.full-width { grid-column: 1 / -1; }
    
    label { font-weight: 700; margin-bottom: 0.5rem; color: #334155; font-size: 0.9rem; }
    input, select, textarea { padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #00a0d2; box-shadow: 0 0 0 3px rgba(0, 160, 210, 0.1); }
    
    .checkbox-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; background: #f8fafc; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; }
    .checkbox-group label { display: flex; align-items: center; gap: 0.6rem; font-weight: 500; color: #475569; margin: 0; }
    
    /* Photo Handling */
    .photo-upload input[type="file"] { padding: 1rem; border: 2px dashed #cbd5e1; border-radius: 8px; background: #f8fafc; width: 100%; cursor: pointer; }
    .photos-preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .photo-item { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 1; border: 2px solid #e2e8f0; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; }
    .photo-item .delete-btn { position: absolute; top: 4px; right: 4px; background: #ef4444; color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-weight: bold; }

    /* Archive Weekly Grouping */
    .week-group { margin-bottom: 3rem; }
    .week-header { background: #0d1628; color: #fff; padding: 1rem 1.5rem; border-radius: 10px; margin-bottom: 1.2rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #00a0d2; font-family: 'Montserrat'; }
    .visit-card { background: #fff; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 10px; margin-bottom: 1rem; transition: 0.2s; }
    .visit-card:hover { border-color: #00a0d2; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    .visit-main { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .visit-info h4 { font-size: 1.15rem; color: #0d1628; font-weight: 700; }
    .visit-meta { font-size: 0.85rem; color: #64748b; font-weight: 600; margin-top: 2px; }
    .visit-badges { display: flex; gap: 0.8rem; margin-top: 0.8rem; }
    .badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    
    /* Dashboard */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .stat-card { padding: 1.8rem; border-radius: 12px; color: #fff; position: relative; overflow: hidden; }
    .stat-card.blue { background: linear-gradient(135deg, #0d1628 0%, #1e293b 100%); }
    .stat-card.cyan { background: linear-gradient(135deg, #00a0d2 0%, #0084ad 100%); }
    .stat-card.orange { background: linear-gradient(135deg, #f39c12 0%, #d68910 100%); }
    .stat-val { font-size: 2.8rem; font-weight: 800; font-family: 'Montserrat'; line-height: 1; }
    .stat-lab { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; opacity: 0.8; letter-spacing: 1px; margin-bottom: 0.5rem; }

    /* Executive Module */
    .exec-visuals-box { background: #f0f9ff; border: 2px dashed #00a0d2; border-radius: 12px; padding: 2rem; margin-bottom: 2rem; display: none; }
    .exec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 1.5rem; }

    @media (max-width: 768px) { .form-row, .exec-grid { grid-template-columns: 1fr; } .container { padding: 1rem; } }
  </style>
</head>
<body>

<div class="header">
  <h1>ZTE - LFM Training on Field professional tools</h1>
  <div class="header-right">
    <div class="sync-badge online" id="syncBadge">
      <span class="dot"></span>
      <span id="syncText">System Ready</span>
    </div>
  </div>
</div>

<div class="nav">
  <div class="nav-item active" onclick="switchToSection('dashboard')">Dashboard</div>
  <div class="nav-item" onclick="switchToSection('newVisit')">New Visit</div>
  <div class="nav-item" onclick="switchToSection('archive')">Archive</div>
  <div class="nav-item" onclick="switchToSection('reports')">Reporting</div>
</div>

<div class="container">
  
  <div class="section active" id="dashboard">
    <div id="dashboardContent"></div>
  </div>

  <div class="section" id="newVisit">
    <div class="form-container">
      <h2 id="formTitle">Record Training Session</h2>
      <form id="visitForm">
        <div class="form-row">
          <div class="form-col">
            <label>Retail Store *</label>
            <select id="storeName" required>
              <option value="">-- Select --</option>
              <option>Mediaworld</option><option>Unieuro</option><option>Euronics</option>
              <option>Expert</option><option>Comet</option><option>Bruno</option>
              <option>DG Group</option><option>Online Training Session</option><option>Other</option>
            </select>
          </div>
          <div class="form-col">
            <label>City / Location *</label>
            <input type="text" id="storeLocation" placeholder="e.g. Rome" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Visit Date *</label>
            <input type="date" id="visitDate" required>
            <small id="weekDisplay" style="color: #00a0d2; font-weight: 700; margin-top: 0.5rem;"></small>
          </div>
          <div class="form-col">
            <label>Delivery Mode</label>
            <select id="deliveryMode">
                <option>In Person</option>
                <option>Online Session</option>
                <option>On the Job</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>Sell-out (Units)</label>
            <input type="number" id="sellout" value="0" min="0">
          </div>
          <div class="form-col">
            <label>Target (Units)</label>
            <input type="number" id="target" value="0" min="0">
          </div>
        </div>

        <div class="form-row">
            <div class="form-col"><label>Staff Trained</label><input type="number" id="staffCount" value="0"></div>
            <div class="form-col"><label>Ambassadors</label><input type="number" id="ambassadorsCount" value="0"></div>
        </div>

        <div class="form-col full-width" style="margin-bottom:2rem;">
            <label>Strategic Objectives *</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="objective" value="focus su top di gamma"> Focus on Flagship</label>
                <label><input type="checkbox" name="objective" value="Increase sales"> Increase Sales</label>
                <label><input type="checkbox" name="objective" value="Brand awareness"> Brand Awareness</label>
            </div>
        </div>

        <div class="form-col full-width" style="margin-bottom:2rem;">
            <label>Content Pillars *</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="contents" value="2026 Lineup"> 2026 Lineup</label>
                <label><input type="checkbox" name="contents" value="ZTE Lineup"> ZTE Lineup</label>
                <label><input type="checkbox" name="contents" value="Corporate Info"> Corporate Info</label>
            </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label>In-Store Photos</label>
            <input type="file" id="visitPhotos" multiple accept="image/*">
            <div id="photosPreview" class="photos-preview"></div>
          </div>
          <div class="form-col">
            <label>Power BI Screenshot</label>
            <input type="file" id="powerBiPhoto" accept="image/*">
            <div id="powerBiPreview" class="photos-preview"></div>
          </div>
        </div>

        <div class="form-col full-width" style="margin-top:1rem;">
          <label>Observer Notes</label>
          <textarea id="notes" placeholder="Describe the visit outcome..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Session</button>
          <button type="reset" class="btn btn-secondary">Clear</button>
        </div>
      </form>
    </div>
  </div>

  <div class="section" id="archive">
    <div class="archive-container">
      <h2>Weekly History</h2>
      <div id="archiveList"></div>
    </div>
  </div>

  <div class="section" id="reports">
    <div class="reports-container">
      <h2>Global Reporting Engine</h2>
      <div class="report-selectors">
        <div class="selector-group">
          <label>Report Level</label>
          <select id="reportType" onchange="updateReportUI()">
            <option value="weekly">Weekly Detailed</option>
            <option value="monthly">Monthly Executive</option>
          </select>
        </div>
        <div class="selector-group">
          <label>Period Label</label>
          <input type="text" id="reportPeriod" placeholder="e.g. May 2026">
        </div>
      </div>

      <div class="exec-visuals-box" id="execModule">
        <h3>Executive Highlights (Optional)</h3>
        <p style="font-size:0.85rem; color:#64748b;">Append global dashboards or highlight photos to the executive report.</p>
        <div class="exec-grid">
          <div class="form-col">
            <label>PBI Dashboards (Max 2)</label>
            <input type="file" id="execDashFiles" multiple accept="image/*">
            <div id="execDashPreview" class="photos-preview"></div>
          </div>
          <div class="form-col">
            <label>Top Highlights (Max 8)</label>
            <input type="file" id="execHighFiles" multiple accept="image/*">
            <div id="execHighPreview" class="photos-preview"></div>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="generatePPTX()" style="background:#f39c12; width:100%; font-size:1.1rem; padding:1.2rem;">
        <i class="fa-solid fa-file-powerpoint" style="margin-right:10px;"></i> Generate Professional Deck
      </button>
    </div>
  </div>

</div>

<script>
// --- DB CONFIGURATION (RECONNECT TO ORIGINAL V3) ---
const CONFIG = { dbName: 'ZTEReportDBv3', dbVersion: 1 };
let db, visits = [], manualDash = [], manualHigh = [];

// --- APP INIT ---
async function init() {
  db = await new Promise((res, rej) => {
    const req = indexedDB.open(CONFIG.dbName, CONFIG.dbVersion);
    req.onupgradeneeded = e => e.target.result.createObjectStore('visits', { keyPath: 'id' });
    req.onsuccess = e => res(e.target.result);
    req.onerror = rej;
  });
  await loadData();
  renderDashboard();
}

async function loadData() {
  visits = await new Promise(res => {
    const tx = db.transaction('visits', 'readonly');
    tx.objectStore('visits').getAll().onsuccess = e => res(e.target.result);
  });
}

// --- UTILS ---
function getWeekNumber(d) {
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  return Math.ceil((((d - new Date(Date.UTC(d.getUTCFullYear(), 0, 1))) / 86400000) + 1) / 7);
}

document.getElementById('visitDate').onchange = function() {
    if(this.value) document.getElementById('weekDisplay').innerText = "Assigned to Week " + getWeekNumber(new Date(this.value));
};

function blobToBase64(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(file);
  });
}

// --- UI LOGIC ---
function switchToSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if(event) event.target.classList.add('active');
  if(id === 'archive') renderArchive();
  if(id === 'dashboard') renderDashboard();
}

function updateReportUI() {
    document.getElementById('execModule').style.display = document.getElementById('reportType').value === 'monthly' ? 'block' : 'none';
}

function renderDashboard() {
    const container = document.getElementById('dashboardContent');
    if(visits.length === 0) {
        container.innerHTML = `<div class='form-container' style='text-align:center;'><h3>No data found.</h3><p>Record your first visit to start.</p></div>`;
        return;
    }
    const sell = visits.reduce((a,b)=>a+(parseInt(b.sellout)||0), 0);
    const target = visits.reduce((a,b)=>a+(parseInt(b.target)||0), 0);
    const perc = target > 0 ? (sell/target*100).toFixed(1) : 0;
    const staff = visits.reduce((a,b)=>a+(parseInt(b.staffCount)||0)+(parseInt(b.ambassadorsCount)||0), 0);

    container.innerHTML = `
        <div class="dashboard-grid">
            <div class="stat-card blue"><div class="stat-lab">Total Sessions</div><div class="stat-val">${visits.length}</div></div>
            <div class="stat-card cyan"><div class="stat-lab">Total Sell-out</div><div class="stat-val">${sell}</div></div>
            <div class="stat-card success" style="background:#22c55e;"><div class="stat-lab">Achievement</div><div class="stat-val">${perc}%</div></div>
            <div class="stat-card orange"><div class="stat-lab">Staff Trained</div><div class="stat-val">${staff}</div></div>
        </div>
    `;
}

// --- ARCHIVE GROUPING (CRITICAL UX FIX) ---
function renderArchive() {
  const list = document.getElementById('archiveList');
  if(visits.length === 0) { list.innerHTML = "<p>Archive is empty.</p>"; return; }

  const sorted = [...visits].sort((a,b) => new Date(b.visitDate) - new Date(a.visitDate));
  const grouped = sorted.reduce((acc, v) => {
    const key = `WEEK ${getWeekNumber(new Date(v.visitDate))} - ${new Date(v.visitDate).getFullYear()}`;
    if(!acc[key]) acc[key] = [];
    acc[key].push(v);
    return acc;
  }, {});

  let html = "";
  for(const week in grouped) {
    html += `<div class="week-group"><div class="week-header"><span>${week}</span><span>${grouped[week].length} Sessions</span></div>`;
    grouped[week].forEach(v => {
      html += `
        <div class="visit-card">
          <div class="visit-main">
            <div class="visit-info">
              <h4>${v.storeName} - ${v.storeLocation}</h4>
              <div class="visit-meta">${v.visitDate} | ${v.deliveryMode || 'In Person'}</div>
            </div>
            <div class="visit-actions">
              <button class="btn-action edit" onclick="editVisit('${v.id}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn-action delete" onclick="deleteVisit('${v.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          <div class="visit-badges">
            <span class="badge">SELL-OUT: ${v.sellout}</span>
            <span class="badge">TARGET: ${v.target}</span>
            <span class="badge">TRAINED: ${(parseInt(v.staffCount)||0)+(parseInt(v.ambassadorsCount)||0)}</span>
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  list.innerHTML = html;
}

// --- FORM HANDLING ---
document.getElementById('visitPhotos').onchange = async function() {
    for(let f of this.files) {
        const b64 = await blobToBase64(f);
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.innerHTML = `<img src="${b64}"><button class="delete-btn" type="button" onclick="this.parentElement.remove()">×</button>`;
        document.getElementById('photosPreview').appendChild(div);
    }
};

document.getElementById('powerBiPhoto').onchange = async function() {
    const b64 = await blobToBase64(this.files[0]);
    document.getElementById('powerBiPreview').innerHTML = `<div class="photo-item"><img src="${b64}"><button class="delete-btn" type="button" onclick="this.parentElement.remove()">×</button></div>`;
};

document.getElementById('visitForm').onsubmit = async (e) => {
    e.preventDefault();
    const saveBtn = document.getElementById('saveBtn');
    const id = saveBtn.dataset.editId || 'v_' + Date.now();
    
    const visit = {
        id,
        storeName: document.getElementById('storeName').value,
        storeLocation: document.getElementById('storeLocation').value,
        visitDate: document.getElementById('visitDate').value,
        deliveryMode: document.getElementById('deliveryMode').value,
        sellout: document.getElementById('sellout').value,
        target: document.getElementById('target').value,
        staffCount: document.getElementById('staffCount').value,
        ambassadorsCount: document.getElementById('ambassadorsCount').value,
        objectives: Array.from(document.querySelectorAll('input[name="objective"]:checked')).map(i => i.value),
        contents: Array.from(document.querySelectorAll('input[name="contents"]:checked')).map(i => i.value),
        photos: Array.from(document.querySelectorAll('#photosPreview img')).map(i => i.src),
        powerBi: document.querySelector('#powerBiPreview img')?.src || null,
        notes: document.getElementById('notes').value
    };

    const tx = db.transaction('visits', 'readwrite');
    tx.objectStore('visits').put(visit);
    alert("Training session saved successfully!");
    
    // Reset
    document.getElementById('visitForm').reset();
    document.querySelectorAll('.photos-preview').forEach(p => p.innerHTML = "");
    delete saveBtn.dataset.editId;
    saveBtn.innerText = "Save Session";
    
    await loadData();
    switchToSection('dashboard');
};

async function editVisit(id) {
    const v = visits.find(x => x.id === id);
    if(!v) return;
    document.getElementById('storeName').value = v.storeName;
    document.getElementById('storeLocation').value = v.storeLocation;
    document.getElementById('visitDate').value = v.visitDate;
    document.getElementById('sellout').value = v.sellout;
    document.getElementById('target').value = v.target;
    document.getElementById('staffCount').value = v.staffCount;
    document.getElementById('ambassadorsCount').value = v.ambassadorsCount;
    document.getElementById('notes').value = v.notes;
    
    v.objectives?.forEach(o => { const el = document.querySelector(`input[value="${o}"]`); if(el) el.checked = true; });
    v.contents?.forEach(c => { const el = document.querySelector(`input[value="${c}"]`); if(el) el.checked = true; });
    
    v.photos?.forEach(p => {
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.innerHTML = `<img src="${p}"><button class="delete-btn" type="button" onclick="this.parentElement.remove()">×</button>`;
        document.getElementById('photosPreview').appendChild(div);
    });
    
    if(v.powerBi) {
        document.getElementById('powerBiPreview').innerHTML = `<div class="photo-item"><img src="${v.powerBi}"><button class="delete-btn" type="button" onclick="this.parentElement.remove()">×</button></div>`;
    }

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.dataset.editId = id;
    saveBtn.innerText = "Update Session";
    switchToSection('newVisit');
}

async function deleteVisit(id) {
    if(!confirm("Are you sure?")) return;
    const tx = db.transaction('visits', 'readwrite');
    tx.objectStore('visits').delete(id);
    await loadData();
    renderArchive();
}

// --- PPTX GENERATOR (STABLE & PROPORTIONAL) ---
async function generatePPTX() {
  const type = document.getElementById('reportType').value;
  const period = document.getElementById('reportPeriod').value || "Current Period";
  if(visits.length === 0) { alert("No data to export."); return; }

  const pres = new PptxGenJS();
  pres.layout = 'LAYOUT_16x9'; // 13.33 x 7.5 inches

  const BRAND = { dark: '0D1628', cyan: '00A0D2', white: 'FFFFFF', gray: '64748B' };

  // Slide 1: Cover
  let s1 = pres.addSlide(); s1.background = { color: BRAND.dark };
  s1.addText("FIELD TRAINING ANALYTICS", { x: 0.8, y: 2.5, w: 12, fontSize: 44, bold: true, color: BRAND.cyan, fontFace: 'Montserrat' });
  s1.addText(`${period.toUpperCase()} | ZTE PROFESSIONAL SUITE`, { x: 0.8, y: 3.4, w: 12, fontSize: 18, color: BRAND.white });

  // Aggregations
  let totS = 0, totT = 0, totP = 0;
  let objMap = {};
  visits.forEach(v => {
      totS += (parseInt(v.sellout)||0);
      totT += (parseInt(v.target)||0);
      totP += (parseInt(v.staffCount)||0) + (parseInt(v.ambassadorsCount)||0);
      (v.objectives||[]).forEach(o => objMap[o] = (objMap[o]||0)+1);
  });
  const ach = totT > 0 ? (totS/totT*100).toFixed(1)+'%' : '0%';

  // Slide 2: Global Metrics (Fixed McKinsey Width)
  let s2 = pres.addSlide();
  s2.addText("EXECUTIVE RECAP - GLOBAL METRICS", { x: 0.5, y: 0.4, fontSize: 24, bold: true, color: BRAND.dark });
  s2.addShape(pres.ShapeType.line, { x: 0.5, y: 0.9, w: 12.3, line: { color: BRAND.cyan, width: 2 } });

  s2.addTable([
    [{text: "KPI METRIC", options: {fill: BRAND.dark, color: BRAND.white, bold:true}}, {text: "VALUE", options: {fill: BRAND.dark, color: BRAND.white, align:'center'}}],
    ["Total Validated Visits", visits.length.toString()],
    ["Overall Headcount Trained", totP.toString()],
    ["Total Sell-out Volume", `${totS} units`],
    ["Assigned Target Volume", `${totT} units`],
    ["Average Achievement Rate", ach]
  ], { x: 0.5, y: 1.5, w: 5.5, colW: [3.8, 1.7], fontSize: 12, border: {pt:0.5, color: BRAND.gray}, margin: 8 });

  if(totP > 0) {
    s2.addChart(pres.ChartType.doughnut, [{ name: 'People', labels: ['Staff', 'Amb.'], values: [1, 1] }], { x: 7, y: 1.5, w: 4.5, h: 3.5, showLegend: true });
  }

  // Detailed Slides (Weekly)
  if(type === 'weekly') {
      visits.forEach(v => {
          let s = pres.addSlide();
          s.addText(`${v.storeName.toUpperCase()} - ${v.storeLocation.toUpperCase()}`, { x: 0.5, y: 0.4, fontSize: 24, bold: true, color: BRAND.dark });
          
          let vAch = (parseInt(v.target)||0) > 0 ? (parseInt(v.sellout)/parseInt(v.target)*100).toFixed(1)+'%' : '0%';
          
          s.addTable([
              [{text: "OPERATIONAL KPI", options: {fill: BRAND.dark, color: BRAND.white, bold:true}}, "VALUE"],
              ["Sell-out Volume", `${v.sellout} units`],
              ["Target Volume", `${v.target} units`],
              ["Achievement", vAch],
              ["Headcount Trained", (parseInt(v.staffCount)||0 + parseInt(v.ambassadorsCount)||0).toString()]
          ], { x: 0.5, y: 1.5, w: 4.5, colW: [3, 1.5], fontSize: 11, border: {pt:0.5}, margin: 8 });

          if(v.notes) {
              s.addText("FIELD OBSERVER NOTES:", { x: 0.5, y: 4.8, fontSize: 10, bold: true, color: '#f39c12' });
              s.addText(v.notes, { x: 0.5, y: 5.1, w: 4.5, h: 1.5, fontSize: 9, fill: 'f8fafc', margin: 8 });
          }

          // Visuals (Aspect Ratio Contain Fix)
          if(v.powerBi) {
              const b64 = v.powerBi.split(',')[1];
              s.addImage({ data: "base64," + b64, x: 5.5, y: 1.5, w: 7.3, h: 5.1, sizing: { type: 'contain', w: 7.3, h: 5.1 } });
          } else if(v.photos && v.photos.length > 0) {
              let grid = [{x:5.5, y:1.5, w:3.5, h:2.4}, {x:9.3, y:1.5, w:3.5, h:2.4}, {x:5.5, y:4.1, w:3.5, h:2.4}, {x:9.3, y:4.1, w:3.5, h:2.4}];
              v.photos.slice(0, 4).forEach((img, idx) => {
                  s.addImage({ data: "base64," + img.split(',')[1], x: grid[idx].x, y: grid[idx].y, w: grid[idx].w, h: grid[idx].h, sizing: { type: 'contain', w: grid[idx].w, h: grid[idx].h } });
              });
          }
      });
  }

  await pres.writeFile({ fileName: `ZTE_Report_${type}_${period.replace(/ /g,'_')}.pptx` });
  alert("Report Generated Successfully!");
}

window.onload = init;
</script>
</body>
</html>
