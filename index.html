<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@v3.12.0/dist/pptxgen.bundle.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, sans-serif; background: #f5f5f5; color: #1a1a1a; line-height: 1.6; }
    .header { background: #0d1628; color: #fff; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .header h1 { font-size: 1.5rem; font-weight: 600; }
    .header-right { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .sync-badge { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; background: rgba(255,255,255,0.1); border-radius: 6px; font-size: 0.875rem; font-weight: 500; border: 1px solid rgba(255,255,255,0.2); }
    .sync-badge.online { color: #27ae60; }
    .sync-badge.offline { color: #e74c3c; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .sync-badge.offline .dot { background: #e74c3c; }

    input[type="text"], input[type="date"], input[type="number"], select, textarea { padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 0.95rem; }

<script>
const CONFIG = { dbName: 'ZTEReportDBv3', dbVersion: 1 };
let db = null, isOnline = navigator.onLine, visits = [];

window.addEventListener('online', () => { isOnline = true; updateSyncStatus(); });
window.addEventListener('offline', () => { isOnline = false; updateSyncStatus(); });

async function initIndexedDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(CONFIG.dbName, CONFIG.dbVersion);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => { db = request.result; resolve(db); };
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('visits')) {
        database.createObjectStore('visits', { keyPath: 'id' });
      }
    };
  });
}

async function loadVisitsFromDB() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('visits', 'readonly');
    const store = tx.objectStore('visits');
    const request = store.getAll();
    request.onerror = () => reject(request.error);
    request.onsuccess = () => { visits = request.result; resolve(visits); };
  });
}

function updateSyncStatus() {
  const badge = document.getElementById('syncBadge');
  const text = document.getElementById('syncText');
  badge.classList.toggle('online', isOnline);
  badge.classList.toggle('offline', !isOnline);
  text.textContent = isOnline ? 'Online' : 'Offline';
}

function handleGoogleAuth() { alert('Google Drive sync coming soon'); }

function getWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

document.getElementById('visitDate').addEventListener('change', function() {
  if(this.value) {
    document.getElementById('weekDisplay').textContent = `Week: ${getWeekNumber(new Date(this.value))}`;
  }
});

function compressImage(file, maxWidth = 800) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', 0.3);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

document.getElementById('visitPhotos').addEventListener('change', async function() {
  const preview = document.getElementById('visitPhotosPreview');
  for(let file of this.files) {
    const compBlob = await compressImage(file, 800);
    const b64 = await blobToBase64(compBlob);
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = `<img src="${b64}"><button type="button" class="delete-btn" onclick="this.parentElement.remove()">×</button>`;
    preview.appendChild(div);
  }
  this.value = '';
});

document.getElementById('powerBiPhoto').addEventListener('change', async function() {
  const preview = document.getElementById('powerBiPhotoPreview');
  preview.innerHTML = '';
  if(this.files[0]) {
    const compBlob = await compressImage(this.files[0], 1000);
    const b64 = await blobToBase64(compBlob);
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = `<img src="${b64}"><button type="button" class="delete-btn" onclick="this.parentElement.remove()">×</button>`;
    preview.appendChild(div);
  }
  this.value = '';
});

async function saveVisit(e) {
  e.preventDefault();
  const storeName = document.getElementById('storeName').value;
  const storeLocation = document.getElementById('storeLocation').value;
  const visitDate = document.getElementById('visitDate').value;
  const objectives = Array.from(document.querySelectorAll('input[name="objective"]:checked')).map(el => el.value);
  const contents = Array.from(document.querySelectorAll('input[name="contents"]:checked')).map(el => el.value);
  const productCategories = Array.from(document.querySelectorAll('input[name="productCategories"]:checked')).map(el => el.value);
  const reasonForVisit = Array.from(document.querySelectorAll('input[name="reasonForVisit"]:checked')).map(el => el.value);
  const deliveryMode = Array.from(document.querySelectorAll('input[name="deliveryMode"]:checked')).map(el => el.value);
  
  if (!storeName || !storeLocation || !visitDate) { alert('Fill all required fields'); return; }
  
  try {
    const submitBtn = document.querySelector('#visitForm button[type="submit"]');
    const isEditMode = submitBtn.dataset.editingVisitId;
    const visitId = isEditMode ? submitBtn.dataset.editingVisitId : 'visit_' + Date.now();
    
    const visitPhotosCompressed = Array.from(document.querySelectorAll('#visitPhotosPreview img')).map(img => img.src);
    const previewPowerBi = document.querySelector('#powerBiPhotoPreview img');
    const powerBiCompressed = previewPowerBi ? previewPowerBi.src : null;
    
    const dateObj = new Date(visitDate);
    const weekNumber = getWeekNumber(dateObj);
    const month = dateObj.getMonth() + 1;
    const year = dateObj.getFullYear();
    const quarter = Math.ceil(month / 3);
    
    const visit = {
      id: visitId,
      storeName, storeLocation, visitDate, weekNumber, month, year, quarter,
      objectives, contents, productCategories, reasonForVisit, deliveryMode,
      sellout: parseInt(document.getElementById('sellout').value) || 0,
      target: parseInt(document.getElementById('target').value) || 0,
      promotersCount: parseInt(document.getElementById('promotersCount').value) || 0,
      ambassadorsCount: parseInt(document.getElementById('ambassadorsCount').value) || 0,
      staffCount: parseInt(document.getElementById('staffCount').value) || 0,
      visitPhotos: visitPhotosCompressed,
      powerBiScreenshot: powerBiCompressed,
      notes: document.getElementById('notes').value,
      lastModified: new Date().toISOString()
    };
    
    const tx = db.transaction('visits', 'readwrite');
    const store = tx.objectStore('visits');
    store.put(visit);
    
    alert(isEditMode ? 'Visit updated!' : 'Visit saved!');
    
    document.getElementById('visitForm').reset();
    document.querySelectorAll('.photos-preview').forEach(el => el.innerHTML = '');
    submitBtn.textContent = 'Save Visit';
    delete submitBtn.dataset.editingVisitId;
    document.querySelector('.form-container h2').textContent = 'New Visit';
    
    await loadVisitsFromDB();
    renderDashboard();
    switchToSection('dashboard');
  } catch (error) {
    console.error('Error:', error);
    alert('Error: ' + error.message);
  }
}

function renderArchive() {
  const archiveList = document.getElementById('archiveList');
  if (visits.length === 0) { archiveList.innerHTML = '<p>No visits yet</p>'; return; }
  
  let html = '<div style="display: grid; gap: 1.5rem;">';
  visits.forEach(visit => {
    let photosHtml = '';
    if (visit.visitPhotos && visit.visitPhotos.length > 0) {
      photosHtml = `<div style="margin-top: 1rem; border-top: 1px solid #eee; padding-top: 1rem;">
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 0.5rem;">
          ${visit.visitPhotos.map(photo => `<img src="${photo}" style="width: 100%; height: 80px; object-fit: cover; border-radius: 4px;">`).join('')}
        </div>
      </div>`;
    }
    
    html += `<div style="border: 1px solid #ddd; padding: 1rem; border-radius: 6px;">
      <strong>${visit.storeName}</strong> - ${visit.visitDate} (W${visit.weekNumber})
      <br><small>📍 ${visit.storeLocation} | 📊 Sell-out: ${visit.sellout} | 👥 Promoters: ${visit.promotersCount} | Staff: ${visit.staffCount}</small>
      ${photosHtml}
      <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
        <button class="btn-action edit" onclick="openEditModal('${visit.id}')">Edit</button>
        <button class="btn-action delete" onclick="deleteVisit('${visit.id}')">Delete</button>
      </div>
    </div>`;
  });
  html += '</div>';
  archiveList.innerHTML = html;
}

async function openEditModal(visitId) {
  const visit = visits.find(v => v.id === visitId);
  if (!visit) return;
  
  document.getElementById('visitForm').reset();
  document.querySelectorAll('.photos-preview').forEach(el => el.innerHTML = '');
  
  document.getElementById('storeName').value = visit.storeName;
  document.getElementById('storeLocation').value = visit.storeLocation;
  document.getElementById('visitDate').value = visit.visitDate;
  
  document.querySelectorAll('input[name="objective"]').forEach(el => el.checked = visit.objectives?.includes(el.value));
  document.querySelectorAll('input[name="contents"]').forEach(el => el.checked = visit.contents?.includes(el.value));
  document.querySelectorAll('input[name="productCategories"]').forEach(el => el.checked = visit.productCategories?.includes(el.value));
  document.querySelectorAll('input[name="reasonForVisit"]').forEach(el => el.checked = visit.reasonForVisit?.includes(el.value));
  document.querySelectorAll('input[name="deliveryMode"]').forEach(el => el.checked = visit.deliveryMode?.includes(el.value));
  
  document.getElementById('promotersCount').value = visit.promotersCount;
  document.getElementById('ambassadorsCount').value = visit.ambassadorsCount;
  document.getElementById('staffCount').value = visit.staffCount;
  document.getElementById('sellout').value = visit.sellout;
  document.getElementById('target').value = visit.target;
  document.getElementById('notes').value = visit.notes;
  
  visit.visitPhotos?.forEach(base64 => {
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = `<img src="${base64}"><button type="button" class="delete-btn" onclick="this.parentElement.remove()">×</button>`;
    document.getElementById('visitPhotosPreview').appendChild(div);
  });
  
  if (visit.powerBiScreenshot) {
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = `<img src="${visit.powerBiScreenshot}"><button type="button" class="delete-btn" onclick="this.parentElement.remove()">×</button>`;
    document.getElementById('powerBiPhotoPreview').appendChild(div);
  }
  
  const submitBtn = document.querySelector('#visitForm button[type="submit"]');
  submitBtn.textContent = 'Update Visit';
  submitBtn.dataset.editingVisitId = visitId;
  switchToSection('newVisit');
}

async function deleteVisit(visitId) {
  if (!confirm('Delete this visit?')) return;
  const tx = db.transaction('visits', 'readwrite');
  tx.objectStore('visits').delete(visitId);
  await loadVisitsFromDB();
  renderArchive();
}

function renderDashboard() {
  const dashboardStatus = document.getElementById('dashboard');
  if (visits.length === 0) {
    dashboardStatus.innerHTML = `<div class="status-box"><h2>Welcome!</h2><p>No visits yet</p><button class="btn btn-primary" onclick="switchToSection('newVisit')">Create Your First Visit</button></div>`;
    return;
  }
  const totalSellout = visits.reduce((sum, v) => sum + (v.sellout || 0), 0);
  const totalTarget = visits.reduce((sum, v) => sum + (v.target || 0), 0);
  const percentage = totalTarget > 0 ? ((totalSellout / totalTarget) * 100).toFixed(1) : '0';

  dashboardStatus.innerHTML = `
    <h2>Dashboard</h2>
    <div class="dashboard-container">
      <div class="stat-card blue"><div class="stat-label">Total Visits</div><div class="stat-value">${visits.length}</div></div>
      <div class="stat-card blue"><div class="stat-label">Sell-out</div><div class="stat-value">${totalSellout}</div></div>
      <div class="stat-card blue"><div class="stat-label">Target %</div><div class="stat-value">${percentage}%</div></div>
    </div>
    <div><button class="btn btn-primary" onclick="switchToSection('newVisit')">Add New Visit</button> <button class="btn btn-secondary" onclick="switchToSection('archive')">View Archive</button> <button class="btn btn-secondary" onclick="switchToSection('reports')">Generate Report</button></div>
  `;
}

function updateReportSelectors() {
  const reportType = document.getElementById('reportType').value;
  const periodSelect = document.getElementById('reportPeriod');
  const yearSelect = document.getElementById('reportYear');
  periodSelect.innerHTML = '<option value="">-- Select --</option>';
  yearSelect.innerHTML = '<option value="">-- Select --</option>';
  if (!reportType) return;
  const periods = new Set();
  const years = new Set();
  visits.forEach(v => {
    years.add(v.year);
    if (reportType === 'weekly') periods.add(v.weekNumber);
    else if (reportType === 'monthly') periods.add(v.month);
    else if (reportType === 'quarterly') periods.add(v.quarter);
  });
  Array.from(years).sort((a, b) => b - a).forEach(year => {
    const opt = document.createElement('option'); opt.value = year; opt.textContent = year; yearSelect.appendChild(opt);
  });
  Array.from(periods).sort((a, b) => b - a).forEach(period => {
    const opt = document.createElement('option'); opt.value = period;
    if (reportType === 'weekly') opt.textContent = `Week ${period}`;
    else if (reportType === 'monthly') {
      const months = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      opt.textContent = months[period];
    } else if (reportType === 'quarterly') opt.textContent = `Q${period}`;
    periodSelect.appendChild(opt);
  });
}

function switchToSection(sectionId) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(sectionId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  const navItemIndex = { 'dashboard': 0, 'newVisit': 1, 'archive': 2, 'reports': 3 };
  if (navItemIndex[sectionId] !== undefined) document.querySelectorAll('.nav-item')[navItemIndex[sectionId]].classList.add('active');
  if (sectionId === 'archive') renderArchive();
  if (sectionId === 'reports') updateReportSelectors();
}

async function initApp() {
  await initIndexedDB();
  await loadVisitsFromDB();
  renderDashboard();
}

// --- GENERATORE DI REPORT PPTX BLINDATO CON LOGICA GRANULARITA' ---
async function generatePPTX() {
  const reportType = document.getElementById('reportType').value;
  const reportPeriod = document.getElementById('reportPeriod').value;
  const reportYear = parseInt(document.getElementById('reportYear').value);
  
  if (!reportType || !reportPeriod || !reportYear) { alert('Select all fields'); return; }
  
  let filteredVisits = visits.filter(v => v.year === reportYear);
  if (reportType === 'weekly') filteredVisits = filteredVisits.filter(v => v.weekNumber === parseInt(reportPeriod));
  else if (reportType === 'monthly') filteredVisits = filteredVisits.filter(v => v.month === parseInt(reportPeriod));
  else if (reportType === 'quarterly') filteredVisits = filteredVisits.filter(v => v.quarter === parseInt(reportPeriod));
  
  if (filteredVisits.length === 0) { alert('No visits found for the selected criteria.'); return; }

  const pptxBtn = document.getElementById('pptxBtn');
  pptxBtn.textContent = "Generating Report...";
  pptxBtn.disabled = true;

  try {
    const pres = new PptxGenJS();
    pres.layout = 'LAYOUT_16x9';
    
    const BRAND_COLORS = { darkBg: '0D1628', accentCyan: '00A0D2', highlightOrange: 'F39C12', cleanWhite: 'FFFFFF', gridBorder: '334155' };
    let periodName = reportType === 'weekly' ? `Week ${reportPeriod}` : reportType === 'monthly' ? `Month ${reportPeriod}` : `Q${reportPeriod}`;

    // Helper per label grafici (evita sbordamenti) e rispetto del "focus su top di gamma"
    const cleanLabel = (str) => {
      if(!str) return "";
      let s = str.replace("Focus on flagship", "Top Focus").replace("Display & Visual Merchandising Check", "Display Check");
      return s.length > 18 ? s.substring(0, 16) + "..." : s;
    };

    // --- AGGREGAZIONI GLOBALI E PER INSEGNA ---
    let totalSellout = 0, totalTarget = 0, totalStaff = 0, totalAmbassador = 0, totalPromoters = 0;
    let chainAggregates = {};
    let qualitativeCounts = {};

    filteredVisits.forEach(v => {
      totalSellout += (v.sellout || 0);
      totalTarget += (v.target || 0);
      totalStaff += (v.staffCount || 0);
      totalAmbassador += (v.ambassadorsCount || 0);
      totalPromoters += (v.promotersCount || 0);

      // Aggregazione per insegna (Serve per report mensili/trimestrali)
      let storeKey = v.storeName || 'Other';
      if (!chainAggregates[storeKey]) chainAggregates[storeKey] = { visits: 0, sellout: 0, target: 0, staff: 0 };
      chainAggregates[storeKey].visits += 1;
      chainAggregates[storeKey].sellout += (v.sellout || 0);
      chainAggregates[storeKey].target += (v.target || 0);
      chainAggregates[storeKey].staff += ((v.staffCount || 0) + (v.ambassadorsCount || 0) + (v.promotersCount || 0));

      // Aggregazione Qualitativa unificata
      (v.objectives || []).forEach(o => { let k = "Obj: " + cleanLabel(o); qualitativeCounts[k] = (qualitativeCounts[k] || 0) + 1; });
      (v.contents || []).forEach(c => { let k = "Topic: " + cleanLabel(c); qualitativeCounts[k] = (qualitativeCounts[k] || 0) + 1; });
      (v.productCategories || []).forEach(p => { let k = "Prod: " + cleanLabel(p); qualitativeCounts[k] = (qualitativeCounts[k] || 0) + 1; });
    });

    let totalHeadcount = totalStaff + totalAmbassador + totalPromoters;
    let avgAchievement = totalTarget > 0 ? ((totalSellout / totalTarget) * 100).toFixed(1) + '%' : '0%';

    // --- SLIDE 1: COPERTINA ---
    let slide1 = pres.addSlide();
    slide1.background = { color: BRAND_COLORS.darkBg };
    slide1.addText("TRAINING REPORT", { x: 1.0, y: 2.2, w: 11.3, fontSize: 52, bold: true, color: BRAND_COLORS.accentCyan, fontFace: 'Montserrat' });
    slide1.addText(`FIELD OPERATIONS & DEVELOPMENT - ${periodName.toUpperCase()} ${reportYear}`, { x: 1.0, y: 3.3, w: 11.3, fontSize: 18, color: BRAND_COLORS.cleanWhite, fontFace: 'Montserrat' });
    slide1.addText("ZTE - LFM Training on Field professional tools", { x: 1.0, y: 6.5, w: 11.3, fontSize: 12, color: BRAND_COLORS.accentCyan, italic: true });

    // --- SLIDE 2: EXECUTIVE RECAP (QUANTITATIVO) ---
    let slide2 = pres.addSlide();
    slide2.background = { color: BRAND_COLORS.darkBg };
    slide2.addText("EXECUTIVE RECAP - GLOBAL METRICS", { x: 0.6, y: 0.4, w: 12.0, fontSize: 28, bold: true, color: BRAND_COLORS.accentCyan, fontFace: 'Montserrat' });

    slide2.addTable([
      [{ text: "METRICHE GLOBALI", options: { bold: true, fill: BRAND_COLORS.accentCyan, color: BRAND_COLORS.cleanWhite } },
       { text: "VALORE CONSOLIDATO", options: { bold: true, fill: BRAND_COLORS.accentCyan, color: BRAND_COLORS.cleanWhite, align: 'center' } }],
      ["Totale Visite nei Punti Vendita", filteredVisits.length.toString()],
      ["Risorse Formate Complessive (Headcount)", totalHeadcount.toString()],
      ["Volume Sell-out Totale rilevato", `${totalSellout} unità`],
      ["Target di Periodo assegnato", `${totalTarget} unità`],
      ["Tasso di Raggiungimento Target Medio", avgAchievement]
    ], { x: 0.6, y: 1.5, w: 6.0, fontSize: 12, color: BRAND_COLORS.cleanWhite, border: { pt: 1, color: BRAND_COLORS.gridBorder }, margin: 10 });

    if (totalHeadcount > 0) {
      slide2.addChart(pres.ChartType.doughnut, [
        { name: 'Personale', labels: ['Staff Negozio', 'Ambassador', 'Promoter'], values: [totalStaff, totalAmbassador, totalPromoters] }
      ], { x: 7.2, y: 1.5, w: 5.5, h: 4.5, showLegend: true, legendColor: BRAND_COLORS.cleanWhite, chartColors: ['00A0D2', 'F39C12', '27AE60'] });
    }

    // --- SLIDE 3: EXECUTIVE RECAP (QUALITATIVO) ---
    let slide3 = pres.addSlide();
    slide3.background = { color: BRAND_COLORS.darkBg };
    slide3.addText("EXECUTIVE RECAP - OPERATIONAL FOCUS", { x: 0.6, y: 0.4, w: 12.0, fontSize: 28, bold: true, color: BRAND_COLORS.accentCyan, fontFace: 'Montserrat' });

    const qualKeys = Object.keys(qualitativeCounts);
    if (qualKeys.length > 0) {
       slide3.addText("Qualitative Parameters Distribution", { x: 0.6, y: 1.2, w: 12.1, h: 0.3, fontSize: 12, color: BRAND_COLORS.highlightOrange, bold: true, fontFace: 'Montserrat' });
       slide3.addChart(pres.ChartType.bar, [{ name: 'Occurrences', labels: qualKeys, values: Object.values(qualitativeCounts) }], {
          x: 0.6, y: 1.6, w: 12.1, h: 4.5, barDir: 'bar', showValue: true, dataLabelColor: BRAND_COLORS.cleanWhite, dataLabelFontSize: 9,
          valAxisHidden: true, catAxisLabelColor: BRAND_COLORS.cleanWhite, catAxisLabelFontSize: 9, chartColors: ['F39C12']
       });
    }

    // --- RAMIFICAZIONE GRANULARITA' ---
    if (reportType === 'monthly' || reportType === 'quarterly') {
        // PERIODO LUNGO (EXECUTIVE) - Aggiungo Slide Aggregata per Insegna
        let slideChain = pres.addSlide();
        slideChain.background = { color: BRAND_COLORS.darkBg };
        slideChain.addText("CHAIN PERFORMANCE INDEX", { x: 0.6, y: 0.4, w: 12.0, fontSize: 28, bold: true, color: BRAND_COLORS.accentCyan, fontFace: 'Montserrat' });

        let tableRows = [
          [{ text: "INSEGNA RETAIL", options: { fill: BRAND_COLORS.accentCyan, bold: true, color: BRAND_COLORS.cleanWhite } },
           { text: "N. VISITE", options: { fill: BRAND_COLORS.accentCyan, bold: true, color: BRAND_COLORS.cleanWhite } },
           { text: "SELL-OUT", options: { fill: BRAND_COLORS.accentCyan, bold: true, color: BRAND_COLORS.cleanWhite } },
           { text: "TARGET", options: { fill: BRAND_COLORS.accentCyan, bold: true, color: BRAND_COLORS.cleanWhite } },
           { text: "ACHIEVEMENT %", options: { fill: BRAND_COLORS.accentCyan, bold: true, color: BRAND_COLORS.cleanWhite } },
           { text: "RISORSE FORMATE", options: { fill: BRAND_COLORS.accentCyan, bold: true, color: BRAND_COLORS.cleanWhite } }]
        ];

        Object.keys(chainAggregates).forEach(chainName => {
          let cData = chainAggregates[chainName];
          let cAch = cData.target > 0 ? ((cData.sellout / cData.target) * 100).toFixed(1) + '%' : '0%';
          tableRows.push([chainName, cData.visits.toString(), `${cData.sellout} u.`, `${cData.target} u.`, cAch, cData.staff.toString()]);
        });
        slideChain.addTable(tableRows, { x: 0.6, y: 1.8, w: 12.1, fontSize: 11, color: BRAND_COLORS.cleanWhite, border: { pt: 0.5, color: BRAND_COLORS.gridBorder }, margin: 8 });

        // Galleria Foto Migliori del Mese/Trimestre (Max 4 foto globali)
        let allPhotos = [];
        filteredVisits.forEach(v => {
            if (v.visitPhotos && v.visitPhotos.length > 0) { allPhotos = allPhotos.concat(v.visitPhotos); }
        });

        if (allPhotos.length > 0) {
            let slideGallery = pres.addSlide();
            slideGallery.background = { color: BRAND_COLORS.darkBg };
            slideGallery.addText("IN-STORE EXCELLENCE VISUALS", { x: 0.6, y: 0.4, w: 12.0, fontSize: 26, bold: true, color: BRAND_COLORS.accentCyan });

            const gridPositions = [
              { x: 0.6, y: 1.4, w: 5.8, h: 2.4 }, { x: 6.9, y: 1.4, w: 5.8, h: 2.4 },
              { x: 0.6, y: 4.3, w: 5.8, h: 2.4 }, { x: 6.9, y: 4.3, w: 5.8, h: 2.4 }
            ];

            const cleanB64 = (str) => str.includes("base64,") ? str.split("base64,")[1].trim() : str.trim();

            allPhotos.slice(0, 4).forEach((imgData, index) => {
              let pData = cleanB64(imgData);
              if (pData) {
                  let pos = gridPositions[index];
                  slideGallery.addImage({
                    data: "base64," + pData,
                    x: pos.x, y: pos.y, w: pos.w, h: pos.h,
                    sizing: { type: 'contain' } // FIX DEFORMAZIONE FOTO
                  });
              }
            });
        }

    } else {
        // PERIODO CORTO (WEEKLY) - Slide di dettaglio singola per ogni punto vendita
        filteredVisits.forEach(visit => {
          let slideVisit = pres.addSlide();
          slideVisit.background = { color: BRAND_COLORS.darkBg };

          slideVisit.addText(`${(visit.storeName || '').toUpperCase()} - ${(visit.storeLocation || '').toUpperCase()}`, { x: 0.6, y: 0.4, w: 12.0, fontSize: 26, bold: true, color: BRAND_COLORS.accentCyan, fontFace: 'Montserrat' });
          slideVisit.addText(`Data Rilevazione: ${visit.visitDate} (Week ${visit.weekNumber})`, { x: 0.6, y: 1.0, w: 12.0, fontSize: 12, color: BRAND_COLORS.cleanWhite });

          let vAch = visit.target > 0 ? ((visit.sellout / visit.target) * 100).toFixed(1) + '%' : '0%';
          slideVisit.addTable([
            [{text: "KPI Operativo", options: {bold: true, fill: BRAND_COLORS.gridBorder, color: BRAND_COLORS.accentCyan}}, {text: "Valore", options: {bold: true, fill: BRAND_COLORS.gridBorder, color: BRAND_COLORS.accentCyan}}],
            ["Volume Sell-out", `${visit.sellout || 0} unità`],
            ["Target di Visita", `${visit.target || 0} unità`],
            ["Tasso di Conversione", vAch],
            ["Staff Formato", (visit.staffCount || 0).toString()],
            ["Ambassador Coinvolti", (visit.ambassadorsCount || 0).toString()],
            ["Promoter Formati", (visit.promotersCount || 0).toString()]
          ], { x: 0.6, y: 1.6, w: 5.5, fontSize: 11, color: BRAND_COLORS.cleanWhite, border: { pt: 0.5, color: BRAND_COLORS.gridBorder }, margin: 6 });

          if (visit.notes) {
              slideVisit.addText("Note / Osservazioni:", { x: 0.6, y: 4.8, w: 5.5, h: 0.3, fontSize: 11, bold: true, color: BRAND_COLORS.highlightOrange });
              slideVisit.addText(visit.notes, { x: 0.6, y: 5.2, w: 5.5, h: 1.5, fontSize: 9.5, color: BRAND_COLORS.cleanWhite, fill: BRAND_COLORS.gridBorder, margin: 6 });
          }

          // Gestione foto nella singola slide con sizing = contain
          const cleanB64 = (str) => str.includes("base64,") ? str.split("base64,")[1].trim() : str.trim();

          if(visit.powerBiScreenshot) {
              let biData = cleanB64(visit.powerBiScreenshot);
              if(biData) slideVisit.addImage({ data: "base64," + biData, x: 6.5, y: 1.6, w: 6.0, h: 5.1, sizing: { type: 'contain' } });
          } else if (visit.visitPhotos && visit.visitPhotos.length > 0) {
              let photoGrid = [
                  { x: 6.5, y: 1.6, w: 2.9, h: 2.45 }, { x: 9.6, y: 1.6, w: 2.9, h: 2.45 },
                  { x: 6.5, y: 4.25, w: 2.9, h: 2.45 }, { x: 9.6, y: 4.25, w: 2.9, h: 2.45 }
              ];
              visit.visitPhotos.slice(0, 4).forEach((imgData, idx) => {
                  let pData = cleanB64(imgData);
                  if (pData) {
                      let pos = photoGrid[idx];
                      slideVisit.addImage({ data: "base64," + pData, x: pos.x, y: pos.y, w: pos.w, h: pos.h, sizing: { type: 'contain' } });
                  }
              });
          }
        });
    }

    const finalName = await pres.writeFile({ fileName: `ZTE_Report_${reportType}_${reportYear}.pptx` });
    alert(`Report ${finalName} Generato con Successo!`);
  } catch (err) {
    console.error("PPTX Error: ", err);
    alert("Error: " + err.message);
  } finally {
    pptxBtn.textContent = "Generate PPTX Report";
    pptxBtn.disabled = false;
  }
}

document.getElementById('visitForm').addEventListener('submit', saveVisit);
window.addEventListener('DOMContentLoaded', initApp);
