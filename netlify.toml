[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com https://www.gstatic.com blob: data:; frame-src 'self' https://accounts.google.com https://www.gstatic.com; connect-src 'self' https: data: blob:;"
